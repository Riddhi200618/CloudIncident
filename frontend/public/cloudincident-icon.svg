<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Shadow for document and badge -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#24191A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 1. Background Cloud Puff (Blush / Dusty Rose) -->
  <path
    d="M 96 46
       C 96 32 108 24 122 26
       C 134 28 142 38 140 50
       C 148 54 150 66 144 74
       C 138 82 126 84 116 84
       L 96 84 Z"
    fill="#EAC4CF"
  />

  <!-- 2. Main Foreground Cloud (Deep Burgundy with layered contours) -->
  <!-- Base Silhouette -->
  <path
    d="M 32 84
       C 20 84 14 74 16 62
       C 18 52 28 46 38 46
       C 40 32 54 22 72 22
       C 88 22 100 30 106 44
       C 116 44 126 52 126 64
       C 126 76 116 84 104 84
       Z"
    fill="#501B24"
  />

  <!-- Cloud Depth Highlight on Upper-Left Contour -->
  <path
    d="M 28 58
       C 30 48 38 44 46 44
       C 48 34 58 26 74 26
       C 84 26 92 30 98 38
       C 92 34 82 30 72 30
       C 56 30 46 38 42 50
       C 34 50 28 54 26 62
       C 26 60 27 59 28 58 Z"
    fill="#7A2B39"
    opacity="0.9"
  />

  <!-- Cloud Bottom Rich Shading -->
  <path
    d="M 20 74
       C 24 82 34 84 46 84
       L 104 84
       C 114 84 122 78 124 70
       C 118 78 106 81 96 81
       L 36 81
       C 28 81 22 77 20 74 Z"
    fill="#3D131B"
    opacity="0.6"
  />

  <!-- 3. Incident Report Document (Cream, rounded, crisp) -->
  <g filter="url(#subtle-shadow)">
    <!-- Document Page -->
    <rect
      x="54"
      y="30"
      width="44"
      height="56"
      rx="9"
      fill="#FAF5EE"
      stroke="#DFB0BD"
      stroke-width="1.5"
    />
    
    <!-- Document Text Indicator Lines -->
    <rect x="63" y="42" width="22" height="4" rx="2" fill="#501B24" />
    <rect x="63" y="50" width="18" height="4" rx="2" fill="#651F2B" />
    <rect x="63" y="58" width="11" height="4" rx="2" fill="#7A2B39" />
  </g>

  <!-- 4. Prominent Alert Badge (Exclamation Circle) -->
  <g filter="url(#subtle-shadow)">
    <!-- Badge Background Circle -->
    <circle
      cx="94"
      cy="70"
      r="16"
      fill="#651F2B"
      stroke="#FAF5EE"
      stroke-width="2"
    />
    
    <!-- Exclamation Mark in Warm White / Light Cream -->
    <!-- Top bar -->
    <path
      d="M 94 61
         L 94 71"
      stroke="#FAF5EE"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <!-- Dot -->
    <circle
      cx="94"
      cy="77"
      r="1.8"
      fill="#FAF5EE"
    />
  </g>
</svg>
